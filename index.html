<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Task Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .video-container { position: relative; width: 100%; max-width: 500px; margin: 15px auto; display: none; }
        video { width: 100%; border-radius: 8px; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        button:disabled { background: #444; cursor: not-allowed; }
        #hud { font-size: 18px; margin: 15px 0; font-weight: bold; }
        #report { margin-top: 20px; font-size: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background: #1e4620; color: #4ade80; border: 1px solid #4ade80; }
        .failed { background: #4c1d1d; color: #f87171; border: 1px solid #f87171; }
    </style>
    
    <!-- FIXED: Using Google's recommended jsDelivr bundle pathway to prevent CORS timeouts -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h1>Spatial Task Tracker</h1>
        <p>Calibrate two relative positions in space, then complete the task under 60 seconds.</p>
        
        <div id="hud">Status: Loading AI Models...</div>
        
        <div class="controls">
            <button id="btnAction" disabled>Start Calibration</button>
        </div>

        <div class="video-container" id="videoContainer">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div id="report"></div>
    </div>

    <script>
        // Mapping global classes cleanly
        const HandLandmarker = mp.tasks.vision.HandLandmarker;
        const FilesetResolver = mp.tasks.vision.FilesetResolver;

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        const hud = document.getElementById("hud");
        const btnAction = document.getElementById("btnAction");
        const videoContainer = document.getElementById("videoContainer");
        const report = document.getElementById("report");

        let handLandmarker = undefined;
        let appState = "LOADING"; 
        let fingerX = null, fingerY = null;
        let savedPositions = [];

        const DISTANCE_THRESHOLD = 0.15; 
        const REQUIRED_HOLD_FRAMES = 5;
        const TOTAL_ALLOWED_TIME = 60;

        let holdCounter = 0;
        let startTime = 0;
        let timerInterval = null;
        let streamRef = null;

        async function initializeHandLandmarker() {
            try {
                // FIXED: Changed library source domain directory map to jsdelivr CDN
                const vision = await FilesetResolver.forVisionTasks(
                    "https://jsdelivr.net"
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://googleapis.com",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                appState = "READY";
                hud.innerText = "Status: Ready to Calibrate";
                btnAction.disabled = false;
            } catch (err) {
                hud.innerText = "Error loading AI network. Check internet and refresh.";
                console.error(err);
            }
        }
        initializeHandLandmarker();

        btnAction.addEventListener("click", async () => {
            if (appState === "READY") {
                savedPositions = [];
                report.style.display = "none";
                appState = "CALIBRATE_P1";
                btnAction.innerText = "Save Position 1";
                videoContainer.style.display = "block";
                await startCamera();
            } else if (appState === "CALIBRATE_P1" && fingerX !== null) {
                savedPositions.push({ x: fingerX, y: fingerY, color: "#3b82f6" });
                appState = "CALIBRATE_P2";
                btnAction.innerText = "Save Position 2";
            } else if (appState === "CALIBRATE_P2" && fingerX !== null) {
                savedPositions.push({ x: fingerX, y: fingerY, color: "#eab308" });
                appState = "TEST_P1";
                btnAction.style.display = "none";
                holdCounter = 0;
                startTime = Date.now();
                startTimer();
            }
        });

        async function startCamera() {
            const constraints = { video: { width: 640, height: 480, facingMode: "user" } };
            streamRef = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = streamRef;
            video.addEventListener("loadeddata", predictWebcam);
        }

        function stopCamera() {
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
            }
            videoContainer.style.display = "none";
            btnAction.style.display = "inline-block";
            btnAction.innerText = "Restart Test";
            appState = "READY";
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                let remaining = Math.max(0, Math.ceil(TOTAL_ALLOWED_TIME - elapsed));
                
                if (appState === "TEST_P1" || appState === "TEST_P2") {
                    hud.innerText = `TEST ACTIVE | Time Left: ${remaining}s`;
                }

                if (remaining <= 0 && (appState === "TEST_P1" || appState === "TEST_P2")) {
                    endTask(false, 0);
                }
            }, 200);
        }

        function endTask(isSuccess, timeTaken) {
            clearInterval(timerInterval);
            stopCamera();
            report.style.display = "block";
            if (isSuccess) {
                hud.innerText = "Status: Completed!";
                report.className = "success";
                report.innerHTML = `<strong>STATUS: TASK CORRECT</strong><br>Time Taken: ${timeTaken.toFixed(2)} seconds!`;
            } else {
                hud.innerText = "Status: Failed!";
                report.className = "failed";
                report.innerHTML = `<strong>STATUS: TASK WRONG</strong><br>Reason: 60 Seconds Timeout Exceeded.`;
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime === lastVideoTime || appState === "READY") {
                if (appState !== "READY") window.requestAnimationFrame(predictWebcam);
                return;
            }
            lastVideoTime = video.currentTime;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let startTimeMs = performance.now();
            const detections = handLandmarker.detectForVideo(video, startTimeMs);

            fingerX = null; fingerY = null;

            if (detections.handLandmarks && detections.handLandmarks.length > 0) {
                // Accessing nested array safely from the top detection mapping instance
                const landmarks = detections.handLandmarks[0];
                const indexTip = landmarks[8]; 
                fingerX = indexTip.x;
                fingerY = indexTip.y;

                ctx.beginPath();
                ctx.arc(fingerX * canvas.width, fingerY * canvas.height, 10, 0, 2 * Math.PI);
                ctx.fillStyle = "#22c55e";
                ctx.fill();
            }

            savedPositions.forEach((pos, idx) => {
                ctx.beginPath();
                ctx.arc(pos.x * canvas.width, pos.y * canvas.height, 25, 0, 2 * Math.PI);
                ctx.lineWidth = 4;
                ctx.strokeStyle = pos.color;
                ctx.stroke();
                ctx.fillStyle = "white";
                ctx.font = "16px Arial";
                ctx.fillText(`P${idx+1}`, pos.x * canvas.width - 10, pos.y * canvas.height + 5);
            });

            if (appState === "CALIBRATE_P1") hud.innerText = "Action: Position your finger for Target 1 and tap button.";
            if (appState === "CALIBRATE_P2") hud.innerText = "Action: Position your finger for Target 2 and tap button.";

            if (appState === "TEST_P1" || appState === "TEST_P2") {
                const targetIdx = appState === "TEST_P1" ? 0 : 1;
                const activeTarget = savedPositions[targetIdx];

                ctx.beginPath();
                ctx.arc(activeTarget.x * canvas.width, activeTarget.y * canvas.height, 35, 0, 2 * Math.PI);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#ef4444";
                ctx.stroke();

                if (fingerX !== null) {
                    let distance = Math.sqrt(Math.pow(fingerX - activeTarget.x, 2) + Math.pow(fingerY - activeTarget.y, 2));
                    
                    if (distance < DISTANCE_THRESHOLD) {
                        holdCounter++;
                        if (holdCounter >= REQUIRED_HOLD_FRAMES) {
                            holdCounter = 0;
                if (distance < DISTANCE_THRESHOLD) {
                    holdCounter++;
                    if (holdCounter >= REQUIRED_HOLD_FRAMES) {
                        holdCounter = 0;
                        if (appState === "TEST_P1") {
                            appState = "TEST_P2";
                        } else if (appState === "TEST_P2") {
                            let finalDuration = (Date.now() - startTime) / 1000;
                            endTask(true, finalDuration);
                            return;
                        }
                    }
                } else {
                    holdCounter = Math.max(0, holdCounter - 1);
                }
            }
            
            ctx.fillStyle = "white";
            ctx.font = "18px Arial";
            ctx.fillText(`Hold Progress: ${holdCounter}/${REQUIRED_HOLD_FRAMES}`, 20, canvas.height - 20);
        }

        if (appState !== "READY") {
            window.requestAnimationFrame(predictWebcam);
        }
