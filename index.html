<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Spatial Task Quality Assurance Engine</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 700px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 24px; margin-top: 0; font-weight: 700; letter-spacing: -0.025em; text-align: left; border-bottom: 1px solid #334155; padding-bottom: 12px;}
        p { color: var(--text-muted); font-size: 14px; text-align: left; margin-bottom: 24px; line-height: 1.5; }

        .system-hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-family: "Courier New", Courier, monospace;
            border-left: 4px solid var(--accent-blue);
        }

        .hud-item { text-align: left; }
        .hud-label { color: var(--text-muted); font-weight: bold; }
        .hud-value { color: var(--text-main); }

        .controls { display: flex; justify-content: flex-start; gap: 12px; margin-bottom: 20px; }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background-color: #334155; color: var(--text-muted); cursor: not-allowed; transform: none; }
        button.abort { background-color: var(--accent-red); }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            background: #000;
            margin-top: 16px;
        }
        video { width: 100%; height: auto; transform: scaleX(-1); display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }

        .analytics-card {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            text-align: left;
            animation: slideIn 0.3s ease-out;
        }
        .analytics-card.success { background: #064e3b; border: 1px solid var(--accent-green); }
        .analytics-card.failed { background: #4c1d1d; border: 1px solid var(--accent-red); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Spatial QA Verification Engine</h1>
        <p>A decentralized, client-side Computer Vision pipeline designed for operational motion mapping verification loops.</p>

        <div class="system-hud">
            <div class="hud-item"><span class="hud-label">ENGINE_STATE:</span> <span id="hudState" class="hud-value" style="color:var(--accent-red);">INITIALIZING</span></div>
            <div class="hud-item"><span class="hud-label">TELEMETRY:</span> <span id="hudTelemetry" class="hud-value">N/A</span></div>
        </div>

        <div class="controls">
            <button id="btnPrimary" disabled>Awaiting Framework...</button>
            <button id="btnAbort" class="abort" style="display: none;">Abort Routine</button>
        </div>

        <div class="viewport-wrapper" id="viewportWrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div id="analyticsCard" class="analytics-card"></div>
    </div>

    <script type="module">
        import {
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        const btnPrimary = document.getElementById("btnPrimary");
        const btnAbort = document.getElementById("btnAbort");
        const videoContainer = document.getElementById("viewportWrapper");
        const analytics = document.getElementById("analyticsCard");

        const EngineConfig = {
            THRESHOLD_DISTANCE: 0.15,
            REQUIRED_HOLD_FRAMES: 6,
            TIMEOUT_LIMIT_SEC: 60,
            CAMERA_PROFILES: { width: 640, height: 480, facingMode: "user" },
            MODEL_ASSET_PATH: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        };

        const EngineStates = {
            INITIALIZING: "INITIALIZING",
            READY: "READY",
            CALIBRATE_P1: "CALIBRATE_P1",
            CALIBRATE_P2: "CALIBRATE_P2",
            TEST_P1: "TEST_P1",
            TEST_P2: "TEST_P2",
            TERMINATED: "TERMINATED"
        };

        class WebAudioEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type, duration) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            beepSuccess() { this.playTone(880, "sine", 0.15); }
            beepCheckpoint() { this.playTone(587, "triangle", 0.1); }
            beepFailure() { this.playTone(220, "sawtooth", 0.4); }
        }

        class ApplicationContext {
            constructor() {
                this.state = EngineStates.INITIALIZING;
                this.handLandmarker = null;
                this.savedPositions = [];
                this.holdCounter = 0;
                this.startTime = 0;
                this.timerInterval = null;
                this.streamRef = null;
                this.fingerX = null;
                this.fingerY = null;
                this.lastVideoTime = -1;
                this.audio = new WebAudioEngine();

                this.dom = {
                    hudState: document.getElementById("hudState"),
                    hudTelemetry: document.getElementById("hudTelemetry"),
                    btnPrimary: btnPrimary,
                    btnAbort: btnAbort,
                    viewport: videoContainer,
                    video: video,
                    canvas: canvas,
                    ctx: ctx,
                    analytics: analytics
                };

                this.dom.btnPrimary.addEventListener("click", () => this.handlePrimaryAction());
                this.dom.btnAbort.addEventListener("click", () => this.terminatePipeline(false, "USER_ABORT"));
            }

            async bootstrap() {
                if (location.protocol === "file:") {
                    this.dom.hudState.innerText = "CORS_ERROR";
                    this.dom.hudTelemetry.innerText = "PLEASE USE HTTP SERVER";
                    console.error("Local file:// protocol detected. MediaPipe tasks require a web server.");
                    alert("Please serve this file using a local web server (e.g. `python -m http.server`) or host via GitHub Pages.");
                    return;
                }

                try {
                    const vision = await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                    );

                    const options = {
                        baseOptions: {
                            modelAssetPath: EngineConfig.MODEL_ASSET_PATH,
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1,
                        minHandDetectionConfidence: 0.3,
                        minHandPresenceConfidence: 0.3,
                        minTrackingConfidence: 0.3
                    };

                    try {
                        this.handLandmarker = await HandLandmarker.createFromOptions(vision, options);
                    } catch (gpuError) {
                        console.warn("GPU Acceleration failed, falling back to CPU:", gpuError);
                        options.baseOptions.delegate = "CPU";
                        this.handLandmarker = await HandLandmarker.createFromOptions(vision, options);
                    }

                    this.transitionState(EngineStates.READY);
                } catch (error) {
                    this.dom.hudState.innerText = "CRITICAL_ERROR";
                    this.dom.hudTelemetry.innerText = "BOOTSTRAP_FAILED";
                    console.error("Bootstrap Fatal Loop: ", error);
                }
            }

            transitionState(newState) {
                this.state = newState;
                this.dom.hudState.innerText = newState;

                switch (newState) {
                    case EngineStates.READY:
                        this.dom.hudState.style.color = "var(--accent-blue)";
                        this.dom.btnPrimary.disabled = false;
                        this.dom.btnPrimary.innerText = "Initialize Setup Sequence";
                        break;
                    case EngineStates.CALIBRATE_P1:
                        this.dom.btnPrimary.innerText = "Commit Vector Location 1";
                        this.dom.hudTelemetry.innerText = "Mapping Target Coordinate alpha";
                        break;
                    case EngineStates.CALIBRATE_P2:
                        this.dom.btnPrimary.innerText = "Commit Vector Location 2";
                        this.dom.hudTelemetry.innerText = "Mapping Target Coordinate beta";
                        break;
                    case EngineStates.TEST_P1:
                        this.dom.btnPrimary.style.display = "none";
                        this.dom.btnAbort.style.display = "inline-block";
                        break;
                }
            }

            async handlePrimaryAction() {
                this.audio.init();
                if (this.state === EngineStates.READY) {
                    this.savedPositions = [];
                    this.dom.analytics.style.display = "none";
                    this.transitionState(EngineStates.CALIBRATE_P1);
                    this.dom.viewport.style.display = "block";
                    await this.initHardwareStream();
                } else if (this.state === EngineStates.CALIBRATE_P1 && this.fingerX !== null) {
                    this.audio.beepCheckpoint();
                    this.savedPositions.push({ x: this.fingerX, y: this.fingerY, color: "#3b82f6" });
                    this.transitionState(EngineStates.CALIBRATE_P2);
                } else if (this.state === EngineStates.CALIBRATE_P2 && this.fingerX !== null) {
                    this.audio.beepCheckpoint();
                    this.savedPositions.push({ x: this.fingerX, y: this.fingerY, color: "#eab308" });
                    this.holdCounter = 0;
                    this.startTime = Date.now();
                    this.transitionState(EngineStates.TEST_P1);
                    this.startChronoLoop();
                }
            }

            async initHardwareStream() {
                try {
                    this.streamRef = await navigator.mediaDevices.getUserMedia({ video: EngineConfig.CAMERA_PROFILES });
                    this.dom.video.srcObject = this.streamRef;
                    this.dom.video.addEventListener("loadeddata", () => {
                        window.requestAnimationFrame(() => this.processPipelineFrame());
                    });
                } catch (err) {
                    this.dom.hudTelemetry.innerText = "HARDWARE_ACCESS_DENIED";
                    this.terminatePipeline(false, "PERMISSIONS_EXCEPTION");
                }
            }

            startChronoLoop() {
                this.timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - this.startTime) / 1000;
                    const remaining = Math.max(0, Math.ceil(EngineConfig.TIMEOUT_LIMIT_SEC - elapsed));

                    if (this.state === EngineStates.TEST_P1 || this.state === EngineStates.TEST_P2) {
                        this.dom.hudTelemetry.innerText = `TIMEOUT IN: ${remaining}s`;
                    }
                    if (remaining <= 0) this.terminatePipeline(false, "TIMEOUT_EXCEPTION");
                }, 200);
            }

            processPipelineFrame() {
                if (this.state === EngineStates.READY) return;

                if (this.dom.video.readyState >= 2 && this.dom.video.currentTime !== this.lastVideoTime) {
                    this.lastVideoTime = this.dom.video.currentTime;

                    this.dom.canvas.width = this.dom.video.videoWidth;
                    this.dom.canvas.height = this.dom.video.videoHeight;
                    this.dom.ctx.clearRect(0, 0, this.dom.canvas.width, this.dom.canvas.height);

                    const detections = this.handLandmarker.detectForVideo(this.dom.video, performance.now());
                    this.fingerX = null;
                    this.fingerY = null;

                    if (detections && detections.handLandmarks && detections.handLandmarks.length > 0) {
                        const firstHand = detections.handLandmarks[0];

                        // Draw hand skeleton lines
                        this.dom.ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                        this.dom.ctx.lineWidth = 2;
                        const connections = [
                            [0,1],[1,2],[2,3],[3,4],
                            [0,5],[5,6],[6,7],[7,8],
                            [5,9],[9,10],[10,11],[11,12],
                            [9,13],[13,14],[14,15],[15,16],
                            [13,17],[17,18],[18,19],[19,20],[0,17]
                        ];
                        connections.forEach(([i, j]) => {
                            this.dom.ctx.beginPath();
                            this.dom.ctx.moveTo(firstHand[i].x * this.dom.canvas.width, firstHand[i].y * this.dom.canvas.height);
                            this.dom.ctx.lineTo(firstHand[j].x * this.dom.canvas.width, firstHand[j].y * this.dom.canvas.height);
                            this.dom.ctx.stroke();
                        });

                        // Draw index fingertip dot (Landmark 8)
                        if (firstHand.length > 8) {
                            const indexTip = firstHand[8];
                            this.fingerX = indexTip.x;
                            this.fingerY = indexTip.y;

                            this.dom.ctx.beginPath();
                            this.dom.ctx.arc(this.fingerX * this.dom.canvas.width, this.fingerY * this.dom.canvas.height, 12, 0, 2 * Math.PI);
                            this.dom.ctx.fillStyle = "#10b981";
                            this.dom.ctx.fill();
                            this.dom.ctx.strokeStyle = "#ffffff";
                            this.dom.ctx.lineWidth = 2;
                            this.dom.ctx.stroke();
                        }
                    }

                    // Render saved locations
                    this.savedPositions.forEach((pos) => {
                        this.dom.ctx.beginPath();
                        this.dom.ctx.arc(pos.x * this.dom.canvas.width, pos.y * this.dom.canvas.height, 25, 0, 2 * Math.PI);
                        this.dom.ctx.lineWidth = 4;
                        this.dom.ctx.strokeStyle = pos.color;
                        this.dom.ctx.stroke();
                    });

                    // Test mode target matching
                    if (this.state === EngineStates.TEST_P1 || this.state === EngineStates.TEST_P2) {
                        const activeIdx = this.state === EngineStates.TEST_P1 ? 0 : 1;
                        const target = this.savedPositions[activeIdx];

                        this.dom.ctx.beginPath();
                        this.dom.ctx.arc(target.x * this.dom.canvas.width, target.y * this.dom.canvas.height, 35, 0, 2 * Math.PI);
                        this.dom.ctx.lineWidth = 2;
                        this.dom.ctx.strokeStyle = "#ef4444";
                        this.dom.ctx.stroke();

                        if (this.fingerX !== null) {
                            const deltaDist = Math.sqrt(Math.pow(this.fingerX - target.x, 2) + Math.pow(this.fingerY - target.y, 2));
                            if (deltaDist < EngineConfig.THRESHOLD_DISTANCE) {
                                this.holdCounter++;
                                if (this.holdCounter >= EngineConfig.REQUIRED_HOLD_FRAMES) {
                                    this.holdCounter = 0;
                                    if (this.state === EngineStates.TEST_P1) {
                                        this.audio.beepCheckpoint();
                                        this.transitionState(EngineStates.TEST_P2);
                                    } else {
                                        this.terminatePipeline(true, "SUCCESS_MET");
                                        return;
                                    }
                                }
                            } else {
                                this.holdCounter = Math.max(0, this.holdCounter - 1);
                            }
                        }
                        this.dom.ctx.fillStyle = "#ffffff";
                        this.dom.ctx.font = "14px monospace";
                        this.dom.ctx.fillText(`BUFFER_STABILITY: ${this.holdCounter}/${EngineConfig.REQUIRED_HOLD_FRAMES}`, 20, this.dom.canvas.height - 20);
                    }
                }

                window.requestAnimationFrame(() => this.processPipelineFrame());
            }

            terminatePipeline(isSuccess, terminationStatusSymbol) {
                clearInterval(this.timerInterval);
                if (this.streamRef) this.streamRef.getTracks().forEach(track => track.stop());

                this.dom.viewport.style.display = "none";
                this.dom.btnAbort.style.display = "none";
                this.dom.btnPrimary.style.display = "inline-block";

                this.transitionState(EngineStates.READY);
                this.dom.hudTelemetry.innerText = terminationStatusSymbol;
                this.dom.analytics.style.display = "block";

                if (isSuccess) {
                    this.audio.beepSuccess();
                    const duration = (Date.now() - this.startTime) / 1000;
                    this.dom.analytics.className = "analytics-card success";
                    this.dom.analytics.innerHTML = `<strong>\u{1F7E2} TRANSACTION_SUCCESS</strong><br>Verification completed in: ${duration.toFixed(2)}s`;
                } else {
                    this.audio.beepFailure();
                    this.dom.analytics.className = "analytics-card failed";
                    this.dom.analytics.innerHTML = `<strong>\u{1F534} TRANSACTION_FAILED</strong><br>Termination Code: ${terminationStatusSymbol}`;
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const context = new ApplicationContext();
            context.bootstrap();
        });
    </script>
</body>
</html>
